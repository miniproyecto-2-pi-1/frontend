<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Salón de Estudio: salas para estudiar en grupo con video, chat y pantalla compartida." />
    <meta name="theme-color" content="#6D3FE0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Salón de Estudio</title>
    <script>
      // Aplica el tema guardado (o el del sistema) antes de pintar, para evitar un destello de color.
      try {
        var tema = localStorage.getItem("tema");
        var oscuro = tema ? tema === "oscuro" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (oscuro) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
