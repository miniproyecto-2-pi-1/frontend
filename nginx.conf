server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json;

  # Los archivos con huella (hash) en el nombre se pueden guardar mucho tiempo.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Aplicación de una sola página: cualquier ruta devuelve index.html y la resuelve React Router.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
