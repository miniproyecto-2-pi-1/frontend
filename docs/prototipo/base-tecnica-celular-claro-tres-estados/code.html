<!-- BEGIN: InteractiveTabScript -->
<script data-purpose="state-toggle-logic">
    function switchState(state) {
      // Ocultar todas las vistas
      const views = ['loading', 'error', 'success'];
      views.forEach(v => {
        const el = document.getElementById(`view-${v}`);
        const tab = document.getElementById(`tab-${v}`);
        if (el) el.classList.add('hidden');
        if (tab) {
          tab.classList.remove('bg-[#6D3FE0]', 'text-white', 'shadow-sm');
          tab.classList.add('text-neutral-400');
        }
      });

      // Mostrar la vista seleccionada
      const activeView = document.getElementById(`view-${state}`);
      const activeTab = document.getElementById(`tab-${state}`);
      
      if (activeView) activeView.classList.remove('hidden');
      if (activeTab) {
        activeTab.classList.add('bg-[#6D3FE0]', 'text-white', 'shadow-sm');
        activeTab.classList.remove('text-neutral-400');
      }
    }
  </script>
<!-- END: InteractiveTabScript -->
