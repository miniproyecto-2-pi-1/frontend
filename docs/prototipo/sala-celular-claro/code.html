<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sala - Celular (Cuadrícula)</title>
<!-- Tailwind CSS CDN v3 -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Noto Sans -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<style data-purpose="typography">
    body {
      font-family: 'Noto Sans', sans-serif;
    }
  </style>
<style data-purpose="custom-patterns">
    /* Patrón de rayas diagonales para la tarjeta de Juan */
    .pattern-stripes {
      background-color: #E8E5F0;
      background-image: repeating-linear-gradient(
        -45deg,
        #F3F1F8,
        #F3F1F8 12px,
        #E3DFED 12px,
        #E3DFED 24px
      );
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-2 sm:p-4 text-slate-800 antialiased">
<!-- BEGIN: PhoneFrame -->
<!-- Contenedor móvil con marco redondeado estilo iOS simulado -->
<main class="w-[390px] h-[844px] max-h-[96vh] bg-white rounded-[44px] shadow-2xl border-[3.5px] border-[#D9D6E5] flex flex-col justify-between overflow-hidden p-5 relative select-none" data-purpose="mobile-viewport">
<!-- BEGIN: TopBar -->
<!-- Encabezado con nombre de la asignatura y estado de conexión -->
<header class="flex items-center justify-between pt-2 pb-4 px-1" data-purpose="room-header">
<h1 class="text-[20px] font-bold tracking-tight text-[#171A21]">Cálculo II</h1>
<!-- Badge de conexión con punto indicador -->
<div class="flex items-center gap-1.5 px-3 py-1 bg-[#DCF5E7] text-[#147D4C] rounded-full text-[13px] font-medium" data-purpose="connection-badge">
<span class="w-2.5 h-2.5 rounded-full bg-[#188B54]"></span>
<span>Conectado</span>
</div>
</header>
<!-- END: TopBar -->
<!-- BEGIN: VideoGrid -->
<!-- Cuadrícula 2x2 para participantes de la videollamada -->
<section class="grid grid-cols-2 gap-3.5 my-auto" data-purpose="participants-grid">
<!-- Participante 1: Camila (tú) -->
<div class="bg-[#EAE6F2] rounded-[10px] aspect-[4/5] flex flex-col items-center justify-center relative shadow-sm" data-purpose="participant-card">
<!-- Avatar circular -->
<div class="w-14 h-14 rounded-full bg-[#6C34E0] flex items-center justify-center text-white text-[19px] font-bold tracking-wider shadow-sm">
          CA
        </div>
<!-- Cápsula de nombre inferior -->
<div class="absolute bottom-2.5 left-2.5 bg-white/95 px-2.5 py-0.5 rounded-[8px] text-[11px] font-medium text-[#2F323A] shadow-xs">
          Camila (tú)
        </div>
</div>
<!-- Participante 2: Juan (con rayas diagonales) -->
<div class="pattern-stripes rounded-[10px] aspect-[4/5] flex flex-col items-center justify-center relative shadow-sm overflow-hidden" data-purpose="participant-card">
<!-- Avatar circular -->
<div class="w-14 h-14 rounded-full bg-[#6C34E0] flex items-center justify-center text-white text-[19px] font-bold tracking-wider shadow-sm">
          JU
        </div>
<!-- Cápsula de nombre inferior -->
<div class="absolute bottom-2.5 left-2.5 bg-white/95 px-2.5 py-0.5 rounded-[8px] text-[11px] font-medium text-[#2F323A] shadow-xs">
          Juan
        </div>
</div>
<!-- Participante 3: María -->
<div class="bg-[#EAE6F2] rounded-[10px] border-[1.5px] border-[#CCC7DB] aspect-[4/5] flex flex-col items-center justify-center relative shadow-sm" data-purpose="participant-card">
<!-- Avatar circular -->
<div class="w-14 h-14 rounded-full bg-[#6C34E0] flex items-center justify-center text-white text-[19px] font-bold tracking-wider shadow-sm">
          MA
        </div>
<!-- Cápsula de nombre inferior -->
<div class="absolute bottom-2.5 left-2.5 bg-white/95 px-2.5 py-0.5 rounded-[8px] text-[11px] font-medium text-[#2F323A] shadow-xs">
          María
        </div>
</div>
<!-- Participante 4: Pablo -->
<div class="bg-[#EAE6F2] rounded-[10px] aspect-[4/5] flex flex-col items-center justify-center relative shadow-sm" data-purpose="participant-card">
<!-- Avatar circular -->
<div class="w-14 h-14 rounded-full bg-[#6C34E0] flex items-center justify-center text-white text-[19px] font-bold tracking-wider shadow-sm">
          PA
        </div>
<!-- Cápsula de nombre inferior -->
<div class="absolute bottom-2.5 left-2.5 bg-white/95 px-2.5 py-0.5 rounded-[8px] text-[11px] font-medium text-[#2F323A] shadow-xs">
          Pablo
        </div>
</div>
</section>
<!-- END: VideoGrid -->
<!-- BEGIN: ControlBar -->
<!-- Barra inferior con 5 botones de acción -->
<footer class="pt-2 pb-4" data-purpose="call-controls">
<nav class="grid grid-cols-5 gap-1 items-start text-center">
<!-- Botón 1: Micrófono apagado -->
<div class="flex flex-col items-center gap-1.5" data-purpose="control-mic">
<button aria-label="Micrófono apagado" class="w-12 h-12 rounded-full border-[1.5px] border-[#6C34E0] bg-white flex items-center justify-center text-[#6C34E0] hover:bg-[#F4F0FC] active:scale-95 transition-transform" type="button">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24">
<path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M19 10v1a7 7 0 01-14 0v-1M12 18v5m-4 0h8" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<span class="text-[10px] leading-[1.1] text-[#474B54] font-medium px-0.5">Micrófono apagado</span>
</div>
<!-- Botón 2: Cámara apagada -->
<div class="flex flex-col items-center gap-1.5" data-purpose="control-camera">
<button aria-label="Cámara apagada" class="w-12 h-12 rounded-full border-[1.5px] border-[#6C34E0] bg-white flex items-center justify-center text-[#6C34E0] hover:bg-[#F4F0FC] active:scale-95 transition-transform" type="button">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24">
<path d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M4 6h9a2 2 0 012 2v8a2 2 0 01-2 2H4a2 2 0 01-2-2V8a2 2 0 012-2z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<span class="text-[10px] leading-[1.1] text-[#474B54] font-medium px-0.5">Cámara apagada</span>
</div>
<!-- Botón 3: Compartir pantalla -->
<div class="flex flex-col items-center gap-1.5" data-purpose="control-share">
<button aria-label="Compartir pantalla" class="w-12 h-12 rounded-full border-[1.5px] border-[#E8E6F0] bg-[#F7F6FA] flex items-center justify-center text-[#2A2B33] hover:bg-[#ECE8F5] active:scale-95 transition-transform" type="button">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24">
<rect height="14" rx="2" ry="2" width="20" x="2" y="3"></rect>
<path d="M8 21h8m-4-4v4m-3-9l3-3 3 3m-3-3v6" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<span class="text-[10px] leading-[1.1] text-[#474B54] font-medium px-0.5">Compartir pantalla</span>
</div>
<!-- Botón 4: Chat y personas -->
<div class="flex flex-col items-center gap-1.5" data-purpose="control-chat">
<button aria-label="Chat y personas" class="w-12 h-12 rounded-full bg-[#6C34E0] flex items-center justify-center text-white shadow-sm hover:bg-[#5C2BCA] active:scale-95 transition-transform" type="button">
<svg class="w-5 h-5" fill="currentColor" viewbox="0 0 24 24">
<path clip-rule="evenodd" d="M3 4.5A2.5 2.5 0 015.5 2h13A2.5 2.5 0 0121 4.5v10a2.5 2.5 0 01-2.5 2.5H7.414l-3.707 3.707A1 1 0 012 20V4.5A2.5 2.5 0 013 4.5zm2.5-.5a.5.5 0 00-.5.5v13.086l2.793-2.793A1 1 0 018.5 15h10a.5.5 0 00.5-.5v-10a.5.5 0 00-.5-.5h-13z" fill-rule="evenodd"></path>
</svg>
</button>
<span class="text-[10px] leading-[1.1] text-[#474B54] font-medium px-0.5">Chat y personas</span>
</div>
<!-- Botón 5: Salir de la sala -->
<div class="flex flex-col items-center gap-1.5" data-purpose="control-leave">
<button aria-label="Salir de la sala" class="w-12 h-12 rounded-full bg-[#B3261E] flex items-center justify-center text-white shadow-sm hover:bg-[#991F18] active:scale-95 transition-transform" type="button">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewbox="0 0 24 24">
<path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<span class="text-[10px] leading-[1.1] text-[#474B54] font-medium px-0.5">Salir de la sala</span>
</div>
</nav>
</footer>
<!-- END: ControlBar -->
</main>
<!-- END: PhoneFrame -->
</body></html>
