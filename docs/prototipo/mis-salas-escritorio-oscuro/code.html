<!DOCTYPE html>

<html class="h-full" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Salón de Estudio</title>
<!-- Tailwind CSS CDN v3 with plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Noto Sans -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind Configuration -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Noto Sans"', 'sans-serif'],
          },
          colors: {
            study: {
              bg: '#2B2833',
              surface: '#25222D',
              cardbg: '#25222D',
              primary: '#6D3FE0',
              text: '#F3F1F8',
              secondary: '#BDB8CC',
              link: '#C4B1FF',
              cardGreen: '#2B7A44',
              cardMagenta: '#97328B',
              border: '#454052',
            }
          },
          borderRadius: {
            'btn': '8px',
            'card': '10px',
          }
        }
      }
    }
  </script>
<!-- BEGIN: Custom Styles -->
<style data-purpose="base-styling">
    body {
      font-family: 'Noto Sans', sans-serif;
      background-color: #1e1b24; /* Background framing canvas */
      color: #F3F1F8;
    }
  </style>
<!-- END: Custom Styles -->
</head>
<body class="min-h-full flex items-center justify-center p-4 sm:p-6 lg:p-10">
<!-- BEGIN: MainApplicationContainer -->
<!-- Contenedor principal de la aplicación con la paleta de modo oscuro (1086x654 proporción escritorio) -->
<main class="w-full max-w-[1086px] bg-[#2B2833] rounded-[24px] shadow-2xl p-6 sm:p-8 md:p-10 border border-[#3b3647] flex flex-col gap-8 select-none" data-purpose="desktop-app-canvas">
<!-- BEGIN: TopHeader -->
<!-- Barra superior de navegación y usuario -->
<header class="flex items-center justify-between w-full" data-purpose="app-header">
<div class="flex items-center gap-3.5">
<!-- Ícono de menú hamburguesa de 3 líneas uniformes (2px) -->
<button aria-label="Abrir menú" class="p-1 text-[#F3F1F8] hover:text-[#C4B1FF] transition-colors focus:outline-none focus:ring-2 focus:ring-[#C4B1FF] rounded" type="button">
<svg class="w-6 h-6 stroke-current" fill="none" stroke-linecap="round" stroke-width="2.2" viewbox="0 0 24 24">
<line x1="4" x2="20" y1="7" y2="7"></line>
<line x1="4" x2="20" y1="12" y2="12"></line>
<line x1="4" x2="20" y1="17" y2="17"></line>
</svg>
</button>
<!-- Título principal -->
<h1 class="text-xl sm:text-[22px] font-bold tracking-tight text-[#F3F1F8]">
          Salón de Estudio
        </h1>
</div>
<!-- Avatar de usuario circular morado con iniciales CA -->
<div class="w-7 h-7 rounded-full bg-[#6D3FE0] flex items-center justify-center text-[11px] font-bold tracking-wider text-white shadow-sm ring-1 ring-white/10" data-purpose="user-avatar">
        CA
      </div>
</header>
<!-- END: TopHeader -->
<!-- BEGIN: ActionControls -->
<!-- Fila superior de acciones: Crear nueva sala y unirse con código -->
<section class="grid grid-cols-1 md:grid-cols-12 gap-5 items-stretch" data-purpose="quick-actions">
<!-- Botón principal "+ Nueva sala" -->
<div class="md:col-span-4 flex">
<button class="w-full bg-[#6D3FE0] hover:bg-[#5b32c4] active:bg-[#522bb8] text-white font-bold text-base py-3.5 px-6 rounded-[8px] flex items-center justify-center gap-2.5 transition-colors shadow-md focus:outline-none focus:ring-2 focus:ring-[#C4B1FF]" type="button">
<svg class="w-5 h-5 stroke-current" fill="none" stroke-linecap="round" stroke-width="2.5" viewbox="0 0 24 24">
<line x1="12" x2="12" y1="5" y2="19"></line>
<line x1="5" x2="19" y1="12" y2="12"></line>
</svg>
<span>Nueva sala</span>
</button>
</div>
<!-- Campo para unirse mediante código con botón interno incorporado -->
<div class="md:col-span-8">
<form class="w-full h-full min-h-[52px] bg-[#25222D] border-[1.5px] border-[#4a4457] rounded-[10px] flex items-center justify-between pl-5 pr-2 py-1.5 focus-within:border-[#C4B1FF] transition-all" onsubmit="event.preventDefault();">
<input class="bg-transparent border-0 text-[#F3F1F8] placeholder-[#9c96aa] text-base focus:ring-0 w-full p-0 outline-none" placeholder="Introduce un código" type="text"/>
<button class="bg-[#6D3FE0] hover:bg-[#5b32c4] text-white font-bold text-sm sm:text-base px-6 py-2 rounded-[8px] transition-colors shrink-0 shadow-sm focus:outline-none focus:ring-2 focus:ring-[#C4B1FF]" type="submit">
            Unirme
          </button>
</form>
</div>
</section>
<!-- END: ActionControls -->
<!-- BEGIN: RoomsListSection -->
<!-- Contenedor con la lista de salas del usuario -->
<section class="flex flex-col gap-4" data-purpose="user-rooms-section">
<h2 class="text-sm font-semibold text-[#BDB8CC] tracking-wide">
        Tus salas
      </h2>
<!-- Cuadrícula con las 3 tarjetas de sala -->
<div class="grid grid-cols-1 md:grid-cols-3 gap-5">
<!-- BEGIN: RoomCard 1 - Cálculo II -->
<article class="bg-[#25222D] rounded-[10px] border border-[#3b3649] overflow-hidden flex flex-col justify-between shadow-lg" data-purpose="room-card">
<!-- Encabezado de la tarjeta: Color Morado -->
<div class="bg-[#6D3FE0] p-4 pt-4 pb-4">
<h3 class="text-lg font-bold text-white tracking-wide leading-tight">
              Cálculo II
            </h3>
<span class="text-xs font-medium text-white/90 tracking-wider">
              K7P2-91XQ
            </span>
</div>
<!-- Cuerpo con información de estado -->
<div class="p-4 flex flex-col gap-1 text-sm text-[#F3F1F8]">
<p class="font-normal text-[#E2DFF0]">Anfitrión</p>
<p class="text-xs text-[#BDB8CC]">3 conectadas</p>
</div>
<!-- Acciones inferiores: Entrar y Copiar ID -->
<footer class="px-4 py-3 border-t border-[#34303f] flex items-center justify-between text-xs font-bold text-[#C4B1FF]">
<button class="hover:underline flex items-center focus:outline-none" type="button">
              Entrar
            </button>
<button class="flex items-center gap-1.5 hover:underline focus:outline-none" title="Copiar ID de la sala" type="button">
<!-- Ícono de copiar ID con dos rectángulos -->
<svg class="w-3.5 h-3.5 stroke-current" fill="none" stroke-width="2" viewbox="0 0 24 24">
<rect height="13" rx="2" ry="2" width="13" x="9" y="9"></rect>
<path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
</svg>
<span>Copiar ID</span>
</button>
</footer>
</article>
<!-- END: RoomCard 1 -->
<!-- BEGIN: RoomCard 2 - Proyecto Integrador -->
<article class="bg-[#25222D] rounded-[10px] border border-[#3b3649] overflow-hidden flex flex-col justify-between shadow-lg" data-purpose="room-card">
<!-- Encabezado de la tarjeta: Color Verde Bosque -->
<div class="bg-[#2B7A44] p-4 pt-4 pb-4">
<h3 class="text-lg font-bold text-white tracking-wide leading-tight">
              Proyecto Integrador
            </h3>
<span class="text-xs font-medium text-white/90 tracking-wider">
              M4T8-27ZB
            </span>
</div>
<!-- Cuerpo con información de estado -->
<div class="p-4 flex flex-col gap-1 text-sm text-[#F3F1F8]">
<p class="font-normal text-[#E2DFF0]">Anfitrión</p>
<p class="text-xs text-[#BDB8CC]">Nadie conectado</p>
</div>
<!-- Acciones inferiores: Entrar y Copiar ID -->
<footer class="px-4 py-3 border-t border-[#34303f] flex items-center justify-between text-xs font-bold text-[#C4B1FF]">
<button class="hover:underline flex items-center focus:outline-none" type="button">
              Entrar
            </button>
<button class="flex items-center gap-1.5 hover:underline focus:outline-none" title="Copiar ID de la sala" type="button">
<svg class="w-3.5 h-3.5 stroke-current" fill="none" stroke-width="2" viewbox="0 0 24 24">
<rect height="13" rx="2" ry="2" width="13" x="9" y="9"></rect>
<path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
</svg>
<span>Copiar ID</span>
</button>
</footer>
</article>
<!-- END: RoomCard 2 -->
<!-- BEGIN: RoomCard 3 - Física Mecánica -->
<article class="bg-[#25222D] rounded-[10px] border border-[#3b3649] overflow-hidden flex flex-col justify-between shadow-lg" data-purpose="room-card">
<!-- Encabezado de la tarjeta: Color Magenta / Púrpura Rojizo -->
<div class="bg-[#97328B] p-4 pt-4 pb-4">
<h3 class="text-lg font-bold text-white tracking-wide leading-tight">
              Física Mecánica
            </h3>
<span class="text-xs font-medium text-white/90 tracking-wider">
              R9D1-55LC
            </span>
</div>
<!-- Cuerpo con información de estado -->
<div class="p-4 flex flex-col gap-1 text-sm text-[#F3F1F8]">
<p class="font-normal text-[#E2DFF0]">Invitado</p>
<p class="text-xs text-[#BDB8CC]">2 conectadas</p>
</div>
<!-- Acciones inferiores: Entrar y Copiar ID -->
<footer class="px-4 py-3 border-t border-[#34303f] flex items-center justify-between text-xs font-bold text-[#C4B1FF]">
<button class="hover:underline flex items-center focus:outline-none" type="button">
              Entrar
            </button>
<button class="flex items-center gap-1.5 hover:underline focus:outline-none" title="Copiar ID de la sala" type="button">
<svg class="w-3.5 h-3.5 stroke-current" fill="none" stroke-width="2" viewbox="0 0 24 24">
<rect height="13" rx="2" ry="2" width="13" x="9" y="9"></rect>
<path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
</svg>
<span>Copiar ID</span>
</button>
</footer>
</article>
<!-- END: RoomCard 3 -->
</div>
</section>
<!-- END: RoomsListSection -->
</main>
<!-- END: MainApplicationContainer -->
<!-- BEGIN: CopyFeedbackLogic -->
<script data-purpose="interaction-handlers">
    // Lógica para retroalimentación al presionar Copiar ID
    document.querySelectorAll('[title="Copiar ID de la sala"]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const textSpan = btn.querySelector('span');
        const prevText = textSpan.innerText;
        textSpan.innerText = '¡Copiado!';
        setTimeout(() => {
          textSpan.innerText = prevText;
        }, 1500);
      });
    });
  </script>
<!-- END: CopyFeedbackLogic -->
</body></html>
