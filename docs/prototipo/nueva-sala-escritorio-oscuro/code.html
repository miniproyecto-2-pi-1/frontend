<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ventana Nueva sala - Computador - Oscuro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: '#6D3FE0',
            'brand-hover': '#5B35C4',
            surface: '#25222D',
            txt: '#F3F1F8',
            'txt-sec': '#BDB8CC',
            link: '#C4B1FF',
            err: '#FF8AA0',
          },
          fontFamily: {
            sans: ['"Noto Sans"', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Noto Sans', sans-serif; background-color: #2B2833; color: #F3F1F8; }
    .border-15 { border-width: 1.5px; border-style: solid; }
  </style>
</head>
<body class="min-h-screen relative overflow-hidden bg-[#2B2833] text-txt antialiased">
  <!-- PANTALLA DE FONDO ATENUADA: "Mis salas" Oscuro -->
  <div class="w-full min-h-screen filter opacity-30 pointer-events-none select-none">
    <header class="w-full max-w-[1440px] mx-auto px-8 py-4 flex items-center justify-between border-b border-15 border-[#3E394A]">
      <div class="flex items-center gap-3">
        <button class="p-1 text-txt"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg></button>
        <span class="text-xl font-bold tracking-tight text-txt">Salón de Estudio</span>
      </div>
      <div class="w-8 h-8 rounded-full bg-brand text-white flex items-center justify-center font-bold text-xs">CA</div>
    </header>

    <div class="max-w-[1200px] mx-auto px-8 py-8 space-y-6">
      <div class="flex items-center gap-4">
        <button class="px-6 py-2.5 rounded-[8px] bg-brand text-white font-semibold text-sm">+ Nueva sala</button>
        <div class="relative flex-1 max-w-md">
          <input type="text" placeholder="Introduce un código" class="w-full px-4 py-2.5 bg-surface rounded-[8px] border-15 border-[#4F495E] text-sm pr-24">
          <button class="absolute right-1.5 top-1/2 -translate-y-1/2 px-4 py-1.5 rounded-[6px] bg-brand text-white text-xs font-semibold">Unirme</button>
        </div>
      </div>

      <div>
        <h2 class="text-base font-bold text-txt mb-4">Tus salas</h2>
        <div class="grid grid-cols-3 gap-5">
          <div class="rounded-[10px] border-15 border-[#3E394A] overflow-hidden bg-surface">
            <div class="bg-brand text-white p-3 font-bold text-sm">Cálculo II <span class="block text-xs font-normal opacity-90">K7P2-91XQ</span></div>
            <div class="p-3 text-xs text-txt-sec">Anfitrión · 3 conectadas</div>
          </div>
          <div class="rounded-[10px] border-15 border-[#3E394A] overflow-hidden bg-surface">
            <div class="bg-[#207A3F] text-white p-3 font-bold text-sm">Proyecto Integrador <span class="block text-xs font-normal opacity-90">M4T8-27ZB</span></div>
            <div class="p-3 text-xs text-txt-sec">Anfitrión · Nadie conectado</div>
          </div>
          <div class="rounded-[10px] border-15 border-[#3E394A] overflow-hidden bg-surface">
            <div class="bg-[#A03E9B] text-white p-3 font-bold text-sm">Física Mecánica <span class="block text-xs font-normal opacity-90">R9D1-55LC</span></div>
            <div class="p-3 text-xs text-txt-sec">Invitado · 2 conectadas</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- CAPA OVERLAY OSCURA / ATENUANTE -->
  <div class="absolute inset-0 bg-black/60 backdrop-blur-[2px] flex items-center justify-center p-4 z-50">
    <!-- DIÁLOGO VENTANA "NUEVA SALA" (Referencia 12 oscuro) -->
    <div class="w-full max-w-[540px] bg-[#25222D] rounded-[10px] p-7 border-15 border-[#3E394A] shadow-2xl animate-in fade-in zoom-in-95 duration-200">
      <h2 class="text-2xl font-bold text-txt tracking-tight mb-5">Nueva sala</h2>
      
      <form onsubmit="event.preventDefault();">
        <div class="mb-3">
          <label for="room-name" class="block text-xs font-semibold text-txt mb-2">Nombre de la sala</label>
          <input 
            type="text" 
            id="room-name" 
            value="Cálculo II" 
            class="w-full px-4 py-2.5 bg-[#2B2833] text-txt rounded-[8px] border-15 border-[#5A5469] focus:border-brand focus:outline-none text-sm transition-colors"
          >
        </div>

        <p class="text-xs text-txt-sec mb-6 leading-relaxed">
          Al crearla recibirás un ID para compartir con tu grupo.
        </p>

        <!-- Botones Abajo a la Derecha -->
        <div class="flex items-center justify-end gap-5 pt-1">
          <button 
            type="button" 
            class="text-sm font-semibold text-link hover:underline transition-all"
          >
            Cancelar
          </button>
          <button 
            type="submit" 
            class="px-5 py-2.5 rounded-[8px] bg-brand text-white font-semibold text-sm shadow-sm hover:bg-brand-hover transition-colors"
          >
            Crear sala
          </button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
