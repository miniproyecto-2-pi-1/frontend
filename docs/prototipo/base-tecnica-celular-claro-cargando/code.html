<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Base técnica - Celular - Claro (Cargando)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Noto Sans', sans-serif;
      background-color: #FFFFFF;
      color: #2B2833;
    }
  </style>
</head>
<body class="min-h-screen bg-[#FFFFFF] text-[#2B2833] flex flex-col items-center p-4">
  <div class="w-full max-w-[390px] h-[800px] bg-[#F4F2F9] rounded-[24px] border-[1.5px] border-[#E2DEED] flex flex-col overflow-hidden shadow-sm">
    <!-- Encabezado -->
    <header class="p-4 border-b-[1.5px] border-[#E2DEED]">
      <h1 class="text-[18px] font-bold text-[#2B2833]">Salón de Estudio</h1>
    </header>

    <!-- Contenido centrado -->
    <main class="flex-1 flex flex-col items-center justify-center p-6 text-center">
      <div class="w-14 h-14 rounded-full border-[3.5px] border-[#E2DEED] border-t-[#6D3FE0] animate-spin mb-6"></div>
      <h2 class="text-[18px] font-bold text-[#2B2833]">Cargando datos…</h2>
      <p class="text-[14px] text-[#5A5469] mt-1.5">Conectando con el servidor.</p>
    </main>
  </div>
</body>
</html>
