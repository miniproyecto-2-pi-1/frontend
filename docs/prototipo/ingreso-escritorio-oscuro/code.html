<!DOCTYPE html><html lang="es"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingreso - Computador - Oscuro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: '#6D3FE0',
            'brand-hover': '#5B35C4',
            surface: '#25222D',
            txt: '#F3F1F8',
            'txt-sec': '#BDB8CC',
            link: '#C4B1FF',
            err: '#FF8AA0',
          },
          fontFamily: {
            sans: ['"Noto Sans"', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Noto Sans', sans-serif; background-color: #2B2833; color: #F3F1F8; }
    .border-15 { border-width: 1.5px; border-style: solid; }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between bg-[#2B2833] text-txt antialiased">
  <!-- Encabezado -->
  <header class="w-full max-w-[1440px] mx-auto px-8 py-5 flex items-center justify-between border-b border-15 border-[#3E394A]">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg bg-brand flex items-center justify-center text-white font-bold text-base shadow-sm">
        S
      </div>
      <span class="text-xl font-bold tracking-tight text-txt">Salón de Estudio</span>
    </div>
  </header>

  <!-- Tarjeta Centrada -->
  <main class="w-full max-w-[480px] mx-auto px-6 py-12 my-auto">
    <div class="bg-surface rounded-[10px] p-8 border-15 border-[#3E394A] shadow-sm">
      <div class="text-left mb-6">
        <h1 class="text-2xl font-bold text-txt tracking-tight">¡Qué bueno verte!</h1>
        <p class="text-sm text-txt-sec mt-1">Entra y estudia con tu grupo.</p>
      </div>

      <form class="space-y-4" onsubmit="event.preventDefault();">
        <!-- Correo Electrónico -->
        <div>
          <label class="block text-xs font-semibold text-txt mb-1.5" for="email">Correo electrónico</label>
          <input type="email" id="email" placeholder="camila@correo.com" class="w-full px-3.5 py-2.5 bg-[#2B2833] text-txt rounded-[8px] border-15 border-[#4F495E] focus:border-brand focus:outline-none text-sm placeholder:text-[#787287] transition-colors">
        </div>

        <!-- Contraseña con Mostrar -->
        <div>
          <label class="block text-xs font-semibold text-txt mb-1.5" for="password">Contraseña</label>
          <div class="relative">
            <input type="password" id="password" placeholder="••••••••" class="w-full px-3.5 py-2.5 bg-[#2B2833] text-txt rounded-[8px] border-15 border-[#4F495E] focus:border-brand focus:outline-none text-sm placeholder:text-[#787287] pr-16 transition-colors">
            <button type="button" onclick="const p = document.getElementById('password'); p.type = p.type === 'password' ? 'text' : 'password';" class="absolute right-3 top-1/2 -translate-y-1/2 text-xs font-medium text-link hover:underline cursor-pointer">
              Mostrar
            </button>
          </div>
        </div>

        <!-- Botón Entrar -->
        <button type="submit" class="w-full py-2.5 mt-2 rounded-[8px] bg-brand text-white font-semibold text-sm shadow-sm hover:bg-brand-hover transition-colors">
          Entrar
        </button>

        <!-- Separador 'o' -->
        <div class="relative flex items-center justify-center my-4">
          <div class="border-t border-15 border-[#3E394A] w-full"></div>
          <span class="bg-surface px-3 text-xs text-txt-sec">o</span>
          <div class="border-t border-15 border-[#3E394A] w-full"></div>
        </div>

        <!-- Continuar con Google -->
        <button type="button" class="w-full py-2.5 rounded-[8px] border-15 border-[#4F495E] bg-[#2B2833] text-txt font-medium text-sm hover:bg-[#34303F] transition-colors flex items-center justify-center gap-2">
          <svg class="w-4 h-4" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"></path>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"></path>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"></path>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"></path>
          </svg>
          Continuar con Google
        </button>

        <!-- Enlace a registro -->
        <p class="text-center text-xs text-txt-sec mt-5">
          ¿No tienes cuenta? <a href="#registro" class="text-link font-semibold hover:underline">Crea tu cuenta</a>
        </p>
      </form>
    </div>
  </main>

  <!-- Pie -->
  <footer class="w-full max-w-[1440px] mx-auto px-8 py-6 flex items-center justify-center text-xs text-txt-sec">
    Ayuda · Salón de Estudio
  </footer>



</body></html>
