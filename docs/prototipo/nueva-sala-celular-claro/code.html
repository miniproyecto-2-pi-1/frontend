<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Ventana Nueva sala - Celular - Claro</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: '#6D3FE0',
            'brand-hover': '#5B35C4',
            surface: '#F4F2F9',
            txt: '#2B2833',
            'txt-sec': '#5A5469',
            link: '#5B35C4',
            err: '#B3261E',
          },
          fontFamily: {
            sans: ['"Noto Sans"', 'sans-serif'],
          }
        }
      }
    }
  </script>
<style>
    body { font-family: 'Noto Sans', sans-serif; }
    .border-15 { border-width: 1.5px; border-style: solid; }
  </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-0 m-0">
<!-- Mobile Container (390px x 844px) -->
<div class="w-[390px] h-[844px] relative overflow-hidden bg-white text-txt antialiased shadow-2xl">
<!-- PANTALLA DE FONDO ATENUADA: "Mis salas" Móvil Claro -->
<div class="w-full h-full filter opacity-35 pointer-events-none select-none px-4 py-4 space-y-4">
<div class="flex items-center justify-between pb-3 border-b border-15 border-[#E6E1F0]">
<span class="text-base font-bold text-txt">Salón de Estudio</span>
<div class="w-7 h-7 rounded-full bg-brand text-white flex items-center justify-center font-bold text-xs">CA</div>
</div>
<div class="w-full py-2.5 rounded-[8px] bg-brand text-white text-xs font-semibold text-center">+ Nueva sala</div>
<div class="w-full py-2 px-3 bg-surface rounded-[8px] border-15 border-[#CCC4DE] text-xs">Introduce un código</div>
<div class="pt-2">
<div class="text-xs font-bold text-txt mb-2">Tus salas</div>
<div class="rounded-[10px] border-15 border-[#E2DCED] overflow-hidden mb-3">
<div class="bg-brand text-white p-2 text-xs font-bold">Cálculo II</div>
<div class="p-2 text-[10px] text-txt-sec">3 conectadas</div>
</div>
<div class="rounded-[10px] border-15 border-[#E2DCED] overflow-hidden">
<div class="bg-[#207A3F] text-white p-2 text-xs font-bold">Proyecto Integrador</div>
<div class="p-2 text-[10px] text-txt-sec">Nadie conectado</div>
</div>
</div>
</div>
<!-- OVERLAY CON DIÁLOGO OCUPANDO ANCHO TOTAL MENOS 16PX MARGEN POR LADO -->
<div class="absolute inset-0 bg-[#2B2833]/45 backdrop-blur-[2px] flex items-center justify-center px-4 z-50">
<div class="w-full bg-white rounded-[10px] p-5 border-15 border-[#E2DCED] shadow-xl">
<h2 class="text-[20px] font-bold text-txt tracking-tight mb-4 leading-none">Nueva sala</h2>
<form onsubmit="event.preventDefault();">
<div class="mb-2.5">
<label class="block text-xs font-semibold text-txt mb-1.5" for="room-name-mobile">Nombre de la sala</label>
<input class="w-full px-3 py-2 bg-white text-txt rounded-[8px] border-15 border-[#5A5469] focus:border-brand focus:outline-none text-xs transition-colors" id="room-name-mobile" type="text" value="Cálculo II"/>
</div>
<p class="text-[11px] text-txt-sec mb-5 leading-relaxed">
            Al crearla recibirás un ID para compartir con tu grupo.
          </p>
<!-- Botones Abajo a la Derecha -->
<div class="flex items-center justify-end gap-4 pt-1">
<button class="text-xs font-semibold text-link hover:underline" type="button">
              Cancelar
            </button>
<button class="px-4 py-2 rounded-[8px] bg-brand text-white font-semibold text-xs shadow-sm hover:bg-brand-hover transition-colors" type="submit">
              Crear sala
            </button>
</div>
</form>
</div>
</div>
</div>
</body></html>
