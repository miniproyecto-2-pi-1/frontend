<!DOCTYPE html><html lang="es"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Ingreso - Celular - Claro (con variante error)</title>
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: '#6D3FE0',
            'brand-hover': '#5B35C4',
            surface: '#F4F2F9',
            txt: '#2B2833',
            'txt-sec': '#5A5469',
            link: '#5B35C4',
            err: '#B3261E',
          },
          fontFamily: {
            sans: ['"Noto Sans"', 'sans-serif'],
          }
        }
      }
    }
  </script>
<style>
    body { font-family: 'Noto Sans', sans-serif; background-color: #FFFFFF; color: #2B2833; width: 390px; min-height: 844px; margin: 0 auto; }
    .border-15 { border-width: 1.5px; border-style: solid; }
  </style>
</head>
<body class="w-[390px] flex flex-col justify-between bg-white text-txt antialiased overflow-y-auto min-h-screen">
<!-- Encabezado con 16px márgenes -->
<header class="w-full px-4 py-4 flex items-center justify-between border-b border-15 border-[#E6E1F0]">
<div class="flex items-center gap-2">
<div class="w-7 h-7 rounded-lg bg-brand flex items-center justify-center text-white font-bold text-sm shadow-sm">
        S
      </div>
<span class="text-base font-bold tracking-tight text-txt">Salón de Estudio</span>
</div>
</header>
<!-- Tarjeta a todo el ancho disponible con 16px de margen lateral -->
<main class="w-full px-4 py-6 my-auto">
<div class="bg-surface rounded-[10px] p-5 border-15 border-[#E2DCED] shadow-sm">
<div class="text-left mb-5">
<h1 class="text-xl font-bold text-txt tracking-tight">¡Qué bueno verte!</h1>
<p class="text-xs text-txt-sec mt-1">Entra y estudia con tu grupo.</p>
</div>
<form class="space-y-3.5" onsubmit="event.preventDefault();">
<!-- Correo Electrónico (Variante con error mostrada) -->
<div>
<label class="block text-xs font-semibold text-txt mb-1" for="email">Correo electrónico</label>
<input class="w-full px-3 py-2 bg-white text-txt rounded-[8px] border-15 border-err focus:outline-none text-xs transition-colors" id="email" type="email" value="camila@correo.com">
</div>
<!-- Contraseña con Mostrar (con borde rojo de error) -->
<div>
<label class="block text-xs font-semibold text-txt mb-1" for="password">Contraseña</label>
<div class="relative">
<input class="w-full px-3 py-2 bg-white text-txt rounded-[8px] border-15 border-err focus:outline-none text-xs pr-14 transition-colors" id="password" type="password" value="12345678">
<button class="absolute right-2.5 top-1/2 -translate-y-1/2 text-xs font-medium text-link hover:underline" onclick="const p = document.getElementById('password'); p.type = p.type === 'password' ? 'text' : 'password';" type="button">
              Mostrar
            </button>
</div>
<!-- Mensaje de error explícito según especificación -->
<div class="flex items-center gap-1.5 mt-1.5 text-err text-[11px] font-medium">
<svg class="w-3.5 h-3.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.5"></circle>
<path d="M12 8v4m0 4h.01" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"></path>
</svg>
<span class="">Correo o contraseña incorrectos.</span>
</div>
</div>
<!-- Botón Entrar -->
<button class="w-full py-2.5 mt-1 rounded-[8px] bg-brand text-white font-semibold text-xs shadow-sm hover:bg-brand-hover transition-colors" type="submit">
          Entrar
        </button>
<!-- Separador 'o' -->
<div class="relative flex items-center justify-center my-3">
<div class="border-t border-15 border-[#E2DCED] w-full"></div>
<span class="bg-surface px-2.5 text-[11px] text-txt-sec">o</span>
<div class="border-t border-15 border-[#E2DCED] w-full"></div>
</div>
<!-- Continuar con Google -->
<button class="w-full py-2 rounded-[8px] border-15 border-[#CCC4DE] bg-white text-txt font-medium text-xs hover:bg-[#F9F7FC] transition-colors flex items-center justify-center gap-2" type="button">
<svg class="w-3.5 h-3.5" viewBox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"></path>
</svg>
          Continuar con Google
        </button>
<!-- Enlace a registro -->
<p class="text-center text-[11px] text-txt-sec mt-3">
          ¿No tienes cuenta? <a class="text-link font-semibold hover:underline" href="#registro">Crea tu cuenta</a>
</p>
</form>
</div>
</main>
<!-- Pie -->
<footer class="w-full px-4 pt-4 pb-6 flex items-center justify-center text-[11px] text-txt-sec mt-auto">
    Ayuda · Salón de Estudio
  </footer>



</body></html>
