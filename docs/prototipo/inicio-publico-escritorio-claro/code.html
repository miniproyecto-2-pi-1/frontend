<!DOCTYPE html><html lang="es"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio - Computador - Claro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: '#6D3FE0',
            'brand-hover': '#5B35C4',
            surface: '#F4F2F9',
            txt: '#2B2833',
            'txt-sec': '#5A5469',
            link: '#5B35C4',
            err: '#B3261E',
          },
          fontFamily: {
            sans: ['"Noto Sans"', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Noto Sans', sans-serif; background-color: #FFFFFF; color: #2B2833; }
    .border-15 { border-width: 1.5px; border-style: solid; }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between bg-white text-txt antialiased">
  <!-- Encabezado -->
  <header class="w-full max-w-[1440px] mx-auto px-8 py-5 flex items-center justify-between border-b border-15 border-[#E6E1F0]">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg bg-brand flex items-center justify-center text-white font-bold text-base shadow-sm">
        S
      </div>
      <span class="text-xl font-bold tracking-tight text-txt">Salón de Estudio</span>
    </div>
    <div>
      <a href="#ingreso" class="inline-flex items-center justify-center px-5 py-2 rounded-[8px] border-15 border-brand text-brand font-medium hover:bg-surface transition-colors text-sm">
        Ingresar
      </a>
    </div>
  </header>

  <!-- Contenido Principal Hero Minimalista -->
  <main class="w-full max-w-[900px] mx-auto px-6 py-24 flex flex-col items-center text-center my-auto">
    <h1 class="text-5xl font-extrabold text-txt tracking-tight leading-[1.2] max-w-[700px]">
      Estudia en grupo,<br>con video y chat
    </h1>
    <p class="mt-6 text-xl text-txt-sec max-w-[560px]">
      Crea una sala, comparte el código y estudien juntos.
    </p>

    <!-- Botones de Acción -->
    <div class="mt-10 flex flex-row items-center justify-center gap-4">
      <a href="#registro" class="inline-flex items-center justify-center px-8 py-3.5 rounded-[8px] bg-brand text-white font-semibold text-base shadow-sm hover:bg-brand-hover transition-colors">
        Crear cuenta
      </a>
      <a href="#ingreso" class="inline-flex items-center justify-center px-8 py-3.5 rounded-[8px] border-15 border-brand text-brand font-semibold text-base hover:bg-surface transition-colors">
        Ingresar
      </a>
    </div>
  </main>

  <!-- Pie de Página -->
  <footer class="w-full max-w-[1440px] mx-auto px-8 py-6 mt-auto flex items-center justify-center text-sm text-txt-sec">
    <a href="#ayuda" class="hover:text-link transition-colors">Ayuda · Salón de Estudio</a>
  </footer>



</body></html>
