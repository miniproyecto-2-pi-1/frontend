<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio - Celular - Oscuro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: '#6D3FE0',
            'brand-hover': '#5B35C4',
            surface: '#25222D',
            txt: '#F3F1F8',
            'txt-sec': '#BDB8CC',
            link: '#C4B1FF',
            err: '#FF8AA0',
          },
          fontFamily: {
            sans: ['"Noto Sans"', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Noto Sans', sans-serif; background-color: #2B2833; color: #F3F1F8; width: 390px; min-height: 844px; margin: 0 auto; }
    .border-15 { border-width: 1.5px; border-style: solid; }
  </style>
</head>
<body class="w-[390px] h-[844px] flex flex-col justify-between bg-[#2B2833] text-txt antialiased overflow-hidden">
  <!-- Encabezado con 16px márgenes -->
  <header class="w-full px-4 py-4 flex items-center justify-between border-b border-15 border-[#3E394A]">
    <div class="flex items-center gap-2">
      <div class="w-7 h-7 rounded-lg bg-brand flex items-center justify-center text-white font-bold text-sm shadow-sm">
        S
      </div>
      <span class="text-base font-bold tracking-tight text-txt">Salón de Estudio</span>
    </div>
    <a href="#ingreso" class="inline-flex items-center justify-center px-3.5 py-1.5 rounded-[8px] border-15 border-brand text-link font-medium text-xs hover:bg-surface transition-colors">
      Ingresar
    </a>
  </header>

  <!-- Hero Celular Oscuro -->
  <main class="w-full px-4 py-8 flex flex-col items-center text-center my-auto">
    <h1 class="text-3xl font-extrabold text-txt tracking-tight leading-[1.25] text-balance">
      Estudia en grupo,<br>con video y chat
    </h1>
    <p class="mt-4 text-sm text-txt-sec leading-relaxed max-w-[320px]">
      Crea una sala, comparte el código y estudien juntos.
    </p>

    <!-- Botones de Acción a todo el ancho -->
    <div class="mt-8 w-full flex flex-col gap-3">
      <a href="#registro" class="w-full py-3 rounded-[8px] bg-brand text-white font-semibold text-sm shadow-sm hover:bg-brand-hover transition-colors flex items-center justify-center">
        Crear cuenta
      </a>
      <a href="#ingreso" class="w-full py-3 rounded-[8px] border-15 border-brand text-link font-semibold text-sm hover:bg-surface transition-colors flex items-center justify-center">
        Ingresar
      </a>
    </div>
  </main>

  <!-- Pie Celular -->
  <footer class="w-full px-4 py-5 border-t border-15 border-[#3E394A] flex items-center justify-center text-xs text-txt-sec">
    <a href="#ayuda" class="hover:text-link transition-colors">Ayuda · Salón de Estudio</a>
  </footer>
</body>
</html>
