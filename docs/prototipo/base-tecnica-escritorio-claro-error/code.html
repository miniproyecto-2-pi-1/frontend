<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Base técnica - Computador - Claro (Error)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans', sans-serif;
      background-color: #FFFFFF;
      color: #2B2833;
    }
  </style>
</head>
<body class="min-h-screen bg-[#FFFFFF] text-[#2B2833] flex flex-col justify-between p-8 antialiased selection:bg-[#6D3FE0] selection:text-white">
  <!-- Encabezado de la página -->
  <header class="w-full max-w-5xl mx-auto flex items-center justify-between py-2">
    <h1 class="text-2xl font-bold tracking-tight text-[#2B2833]">Salón de Estudio</h1>
    <span class="text-xs font-semibold px-2.5 py-1 rounded-full bg-[#F4F2F9] text-[#5A5469] border border-[#5A5469]/20">BASE TÉCNICA</span>
  </header>

  <!-- Contenedor central con tarjeta de estado -->
  <main class="w-full max-w-2xl mx-auto my-auto flex flex-col items-center justify-center">
    <div class="w-full bg-[#F4F2F9] rounded-[10px] border border-[#5A5469]/20 p-12 flex flex-col items-center justify-center text-center shadow-sm">
      <!-- Icono de error / advertencia -->
      <div class="w-12 h-12 rounded-full border-[1.5px] border-[#B3261E] flex items-center justify-center text-[#B3261E] mb-5">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"></circle>
          <line x1="12" y1="8" x2="12" y2="12" stroke-linecap="round"></line>
          <circle cx="12" cy="16" r="0.75" fill="currentColor"></circle>
        </svg>
      </div>

      <h2 class="text-lg font-bold text-[#2B2833] mb-1">No pudimos cargar los datos</h2>
      <p class="text-sm text-[#5A5469] mb-6">Revisa tu conexión e inténtalo de nuevo.</p>

      <!-- Botón Reintentar con el estilo oficial de la guía -->
      <button class="px-6 py-2.5 bg-[#6D3FE0] hover:bg-[#5B35C4] active:bg-[#4C28B5] text-white font-semibold rounded-[8px] text-sm transition-colors shadow-sm focus:outline-none focus:ring-2 focus:ring-[#5B35C4] focus:ring-offset-2">
        Reintentar
      </button>
    </div>
  </main>

  <!-- Pie de página limpio y sin bordes -->
  <footer class="w-full text-center py-4 mt-auto">
    <p class="text-sm text-[#5A5469]">Base técnica · Modo Claro · Salón de Estudio</p>
  </footer>
</body>
</html>
